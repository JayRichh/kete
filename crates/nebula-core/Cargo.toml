[package]
name = "nebula-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
directories = { workspace = true }
rmp-serde = { workspace = true }
# `.kete/studio.toml` (`studio::manifest`); already in Cargo.lock through winresource.
toml = "1"
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The editor icons' PNGs (editors/win.rs): the version the TUI's `image`
# already builds, so no new crate in the tree.
png = "0.17"

# The local UTC offset (`clock::local_offset_secs_at`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "macros"] }
tempfile = { workspace = true }
