[package]
name = "kete-desktop"
version = "0.57.0"
edition = "2021"
license = "MIT"
description = "Kete's desktop window: the board, live sessions and diffs over the Kete daemon"

[[bin]]
name = "kete-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nebula-core = { path = "../../crates/nebula-core" }
nebula-config = { path = "../../crates/nebula-config" }
kete-critters = { path = "../../crates/kete-critters" }
kete-ado = { path = "../../crates/kete-ado" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The save and open dialogs of Settings' export and import (settings_io.rs).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"

[features]
# The WACUP now-playing panel's Windows side (wacup.rs). On by default;
# `--no-default-features` builds the window without it.
default = ["wacup"]
wacup = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
# The done / needs-you toast and its click (alerts.rs): WinRT, on the same
# `windows` crate Tauri already builds, so no new crate in the tree. The
# installed font list (fonts.rs) reads DirectWrite through it as well.
# The WACUP panel (wacup.rs) sends Winamp window messages, reads the process
# name and the App Paths registry key, all through the same crate.
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Graphics_DirectWrite", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# WebView2's own menu and browser keys off, the clipboard read granted
# (quiet.rs): the version Tauri already builds (`cargo tree -i webview2-com`).
webview2-com = "0.39.1"

[dev-dependencies]
kete-ado = { path = "../../crates/kete-ado", features = ["test-support"] }
tempfile = "3"
