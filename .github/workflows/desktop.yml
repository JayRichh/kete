name: Desktop

# The Tauri GUI in desktop/ is its own Cargo workspace, kept out of the root
# one so the core CI never compiles Tauri. This job builds it when it, or
# the nebula-core protocol it speaks, changes.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main, windows]
    paths:
      - "desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: kete-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo and target directories
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1
        with:
          workspaces: desktop -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check the frontend
        run: npm run check

      # The bundle config targets the Windows NSIS installer only, so the
      # other runners build the binary without bundling.
      - name: Build kete-desktop
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: Build kete-desktop (no bundle)
        if: runner.os != 'Windows'
        run: npm run tauri build -- --no-bundle

      - name: Check clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test the backend
        run: cargo test --release --locked

      - name: Upload kete-desktop.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kete-desktop-windows-x64
          path: desktop/target/release/kete-desktop.exe
          if-no-files-found: error

  # The built window driven end to end: tauri-driver over msedgedriver
  # (matched to the runner's WebView2), a real daemon in temp dirs and the
  # TUI suite's scripted fake agent as Claude (desktop/e2e).
  e2e:
    name: kete-desktop end-to-end (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    # Not a gate yet: on the hosted runner tauri-driver cannot start the
    # WebView2 window ("DevToolsActivePort file doesn't exist"). The suite
    # passes locally (npm run e2e in desktop/); run it there before a release.
    # Skipped (not red) until the repo variable DESKTOP_E2E is 'on', which
    # is meant for a self-hosted Windows runner with a desktop session.
    if: vars.DESKTOP_E2E == 'on'
    continue-on-error: true

    env:
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo and target directories
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1
        with:
          workspaces: |
            . -> target
            desktop -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch the drivers and build kete, the fake agent and kete-desktop
        run: npm run e2e:prepare

      - name: Desktop end-to-end
        timeout-minutes: 20
        run: npm run e2e:run
